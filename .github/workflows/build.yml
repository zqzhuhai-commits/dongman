name: Build Dongman (动漫共和国)
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dkp-pacman -S --noconfirm switch-curl switch-zlib switch-sdl2 switch-sdl2_image switch-libjpeg-turbo

      - name: Build NRO
        run: make -j2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dongman-nro
          path: |
            build/*.nro
            build/*.elf
          if-no-files-found: error
